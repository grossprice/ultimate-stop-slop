name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the checker
        run: node --test scripts/check.test.mjs
      - name: Check the README and changelog
        run: node scripts/check.mjs README.md CHANGELOG.md
